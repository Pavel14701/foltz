{# Переход между разделами: крупная ссылка-стрелка. Ставится сразу после #}
{# секции, перед соответствующим CTA: #}
{# {% include '_section_jump.html' with jump_url='...' jump_text='...' %} #}
<div class="section-jump">
    <a class="section-jump__link" href="{{ jump_url }}">
        {{ jump_text|default:'Смотреть раздел' }}
        <span class="section-jump__arrow" aria-hidden="true">→</span>
    </a>
    {% if jump_note %}<p class="section-jump__note">{{ jump_note }}</p>{% endif %}
</div>
